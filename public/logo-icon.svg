<svg viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="badgeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E63946"/>
      <stop offset="1" stop-color="#F2994A"/>
    </linearGradient>
  </defs>

  <!-- Badge -->
  <rect x="10" y="10" width="200" height="200" rx="46" fill="url(#badgeGrad)"/>

  <!-- Printer frame -->
  <g stroke="#FFFFFF" stroke-linecap="round">
    <line x1="55" y1="45" x2="165" y2="45" stroke-width="6"/>
    <line x1="55" y1="45" x2="55" y2="118" stroke-width="6"/>
    <line x1="165" y1="45" x2="165" y2="118" stroke-width="6"/>
    <line x1="45" y1="160" x2="175" y2="160" stroke-width="8"/>
  </g>

  <!-- Print head carriage -->
  <rect x="95" y="37" width="30" height="16" rx="6" fill="#FFFFFF"/>

  <!-- Filament / nozzle path with flow dots -->
  <line x1="110" y1="53" x2="110" y2="100" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <circle cx="110" cy="65" r="2" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="110" cy="80" r="2" fill="#FFFFFF" opacity="0.7"/>
  <polygon points="104,100 116,100 110,112" fill="#FFFFFF"/>

  <!-- Printed object: a medical cross, built layer by layer -->
  <rect x="102" y="150" width="16" height="7" rx="2" fill="#FFFFFF"/>
  <rect x="102" y="141" width="16" height="7" rx="2" fill="#FFFFFF"/>
  <rect x="86" y="132" width="48" height="7" rx="2" fill="#FFFFFF"/>
  <rect x="102" y="123" width="16" height="7" rx="2" fill="#FFFFFF"/>
  <rect x="102" y="114" width="16" height="7" rx="2" fill="#FFFFFF" opacity="0.55"/>
</svg>
