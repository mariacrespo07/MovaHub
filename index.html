<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MovaHub</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Seu CSS (sempre depois do Bootstrap) -->
  <link href="style.css" rel="stylesheet">
</head>
<body>

  <!-- CABEÇALHO -->
  <header class="header position-relative py-4">
    <img src="img/aacd-logo.png" alt="Logo AACD" class="logo-aacd position-absolute">

    <div class="d-flex justify-content-center align-items-center gap-2">
      <span class="logo-icon"><i class="bi bi-broadcast"></i></span>
      <span class="logo-text">MovaHub</span>
    </div>
  </header>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="container text-center main-content">

    <section class="purpose">
      <h1 class="purpose-text">
        "O propósito da AACD é trabalhar para que pessoas com deficiência
        física alcancem seu potencial máximo, superem limitações e vivam
        com autonomia e inclusão social."
      </h1>
    </section>

    <section class="login-area">
      <p class="login-question">Como deseja entrar?</p>

      <div class="d-flex justify-content-center gap-3 flex-wrap">
        <button id="btnAACD" class="btn-login" type="button">
          <span class="icon-box"><i class="bi bi-person"></i></span>
          <span>Entrar como AACD</span>
        </button>

        <button id="btnFabricante" class="btn-login" type="button">
          <span class="icon-box"><i class="bi bi-lock"></i></span>
          <span>Entrar como Fabricante</span>
        </button>
      </div>
    </section>

  </main>

  <!-- RODAPÉ -->
  <footer class="text-center footer">
    © 2025 MovaHub · Todos os direitos reservados
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Seu JS -->
  <script src="script.js"></script>
</body>
</html>
